services:
  db:
    image: postgres:16-alpine
    container_name: hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    volumes:
      - hub-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hub-redis
    restart: unless-stopped
    volumes:
      - hub-redis-data:/data

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: hub-evolution
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@db:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CONFIG_SESSION_PHONE_CLIENT: PersonalHub
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - hub-evolution-instances:/evolution/instances

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: hub-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@db:5432/${POSTGRES_DB:-hub}
      EVOLUTION_BASE_URL: http://evolution:8080
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: hub-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@db:5432/${POSTGRES_DB:-hub}
      EVOLUTION_BASE_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-hub}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

volumes:
  hub-db-data:
  hub-redis-data:
  hub-evolution-instances:
